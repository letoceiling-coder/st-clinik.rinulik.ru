# NEW isolated vhost. Do not merge into existing rinulik.ru server blocks.
# Proxies to st-clinik compose on the host docker bridge (port 18744).

server {
    listen 80;
    server_name st-clinik.rinulik.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name st-clinik.rinulik.ru;

    ssl_certificate     /etc/letsencrypt/live/st-clinik.rinulik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/st-clinik.rinulik.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/st-clinik.rinulik.ru.access.log;
    error_log  /var/log/nginx/st-clinik.rinulik.ru.error.log;
    client_max_body_size 12m;

    location / {
        proxy_pass http://172.17.0.1:18744;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
